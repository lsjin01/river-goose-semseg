[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "river-goose-semseg"
version = "0.1.0"
description = "DINOv3 + Mask2Former river-pollution segmentation with SegFormer knowledge distillation"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "transformers>=4.40",
  "timm>=0.9",
  "numpy",
  "pillow",
  "pyyaml",
  "tqdm",
  "einops",
  "packaging",
  "scipy",
  "matplotlib",
]

[tool.setuptools.packages.find]
include = ["goose_semseg*"]

[tool.ruff]
line-length = 100
target-version = "py39"
