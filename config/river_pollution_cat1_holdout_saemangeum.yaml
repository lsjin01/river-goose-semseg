data_path: data/goose_holdout_saemangeum
output_dir: outputs
run_name: river_pollution_cat1_4cls_holdout_saemangeum

epochs: 100
batch_size: 12
num_workers: 8
prefetch_factor: 1

lr: 4.0e-5
encoder_lr: 1.0e-6
weight_decay: 0.01
grad_clip_norm: 35.0
grad_accum_steps: 1

scheduler_type: PolynomialLR
scheduler_kwargs: '{"power": 0.9}'
warmup_iters: 1500

resize_width: 512
resize_height: 512
num_classes: 4
ignore_index: 255
seed: 42
device: cuda
no_amp: false
flip_prob: 0.0
enable_random_crop: false
crop_width: 1024
crop_height: 1024
enable_rare_class_crop: false
rare_class_crop_prob: 0.3
rare_class_ids: []
rare_class_min_pixels: 0
rare_class_min_ratio: 0.005
rare_class_crop_attempts: 10

backbone_loader: auto
hf_dinov3_model_name_or_path: facebook/dinov3-vitl16-pretrain-lvd1689m
hf_local_files_only: true
dinov3_weights: null
mask2former_pretrained_model_name_or_path: facebook/mask2former-swin-large-ade-semantic
disable_mask2former_pretrained: false
freeze_backbone: false

hidden_dim: 256
m2f_no_object_weight: 0.1
m2f_class_weight: 2.0
m2f_mask_weight: 5.0
m2f_dice_weight: 5.0
m2f_train_num_points: 12544
m2f_oversample_ratio: 3.0
m2f_importance_sample_ratio: 0.75
classification_loss_type: ce

early_stopping_patience: 20
early_stopping_min_delta: 1.0e-4
init_from: null
resume_from: null

enable_cls_aux: false
cls_aux_target_type: coarse
cls_aux_loss_type: bce
cls_aux_weight: 0.1
cls_aux_pos_weight_max: 20.0
